tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of contacts for the current user
security:
  - bearerAuth: [ ]
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
    description: Field to sort by (e.g., name, email, phoneNumber, isFavourite)
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
    description: Filter by isFavourite=true/false
  - in: query
    name: contactType
    schema:
      type: string
      enum: [ personal, work, home, other ]
      example: work
    description: Filter by contact type
responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 2
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: false
  '401':
    $ref: '../../components/responses/401.yaml'
